<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#080c16"/>

  <!-- Back of orbital ring -->
  <g transform="translate(32,32) rotate(-28)">
    <ellipse cx="0" cy="0" rx="24" ry="8" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="75 100" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- 3D LeadSphere sphere -->
  <circle cx="32" cy="32" r="16" fill="url(#sphereGrad)"/>
  <circle cx="32" cy="32" r="16" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>

  <!-- Glowing inner core -->
  <circle cx="30" cy="30" r="8" fill="url(#coreGlow)" filter="url(#glow)"/>
  <circle cx="28" cy="28" r="2.5" fill="#ffffff" opacity="0.95"/>

  <!-- Front of orbital ring -->
  <g transform="translate(32,32) rotate(-28)">
    <ellipse cx="0" cy="0" rx="24" ry="8" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="60 100" stroke-dashoffset="65" stroke-linecap="round"/>
  </g>

  <!-- Orbital satellite pulse -->
  <circle cx="51" cy="22" r="2.5" fill="#67e8f9"/>
</svg>
